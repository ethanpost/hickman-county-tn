<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hickman County, TN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: #000;
            background-color: #f6f6ef;
            padding: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: #f6f6ef;
            border: 1px solid #e6e6df;
        }

        .site-header {
            background-color: #ff6600;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-title {
            font-size: 16px;
            font-weight: bold;
            color: #000;
        }

        .subtitle {
            color: #222;
            font-size: 12px;
        }

        .content {
            padding: 16px 12px 24px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #828282;
        }

        .outline-list {
            list-style: none;
        }

        .outline-item {
            padding: 6px 0;
            border-bottom: 1px dotted #e6e6df;
        }

        .outline-link {
            text-decoration: none;
            color: #000;
            display: block;
        }

        .outline-link:hover {
            text-decoration: underline;
        }

        .outline-title {
            font-weight: normal;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .outline-meta {
            font-size: 11px;
            color: #828282;
            display: flex;
            gap: 15px;
        }

        .outline-date {
            font-weight: normal;
        }

        .error {
            color: #e74c3c;
            padding: 20px;
            background-color: #fee;
            border-left: 4px solid #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="site-title">Hickman County, TN</div>
            <div class="subtitle">Meeting Outlines and Documents</div>
        </header>

        <main class="content">
            <div id="content">
                <div class="loading">Loading outlines...</div>
            </div>
        </main>
    </div>

    <script>
        async function loadOutlines() {
            const contentDiv = document.getElementById('content');
            
            try {
                const response = await fetch('pages/outlines.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const outlines = await response.json();
                
                if (outlines.length === 0) {
                    contentDiv.innerHTML = '<p>No outlines available.</p>';
                    return;
                }

                // Sort by date (newest first)
                outlines.sort((a, b) => new Date(b.date) - new Date(a.date));

                const list = document.createElement('ul');
                list.className = 'outline-list';

                outlines.forEach(outline => {
                    const listItem = document.createElement('li');
                    listItem.className = 'outline-item';
                    
                    const link = document.createElement('a');
                    link.href = `viewer.html?file=${encodeURIComponent(outline.path)}`;
                    link.className = 'outline-link';
                    
                    const title = document.createElement('div');
                    title.className = 'outline-title';
                    title.textContent = outline.title || outline.folder.replace(/_/g, ' ');
                    
                    const meta = document.createElement('div');
                    meta.className = 'outline-meta';
                    
                    const date = document.createElement('span');
                    date.className = 'outline-date';
                    date.textContent = `Date: ${outline.date}`;
                    
                    const filename = document.createElement('span');
                    filename.textContent = outline.filename;
                    
                    meta.appendChild(date);
                    meta.appendChild(filename);
                    
                    link.appendChild(title);
                    link.appendChild(meta);
                    
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });

                contentDiv.innerHTML = '';
                contentDiv.appendChild(list);
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading outlines:</strong> ${error.message}
                    </div>
                `;
                console.error('Error loading outlines:', error);
            }
        }

        // Load outlines when page loads
        document.addEventListener('DOMContentLoaded', loadOutlines);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hickman County, TN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
            --bg: #fafafa;
            --panel: #ffffff;
            --panel-border: #e0e0e0;
            --text: #1f2a3a;
            --muted: #5f6c7b;
            --accent: #059669;
            --accent-strong: #047857;
            --row-hover: #f5f5f5;
            --shadow: 0 14px 40px rgba(20, 28, 40, 0.08);
            --chip: #f0f0f0;
        }

        body[data-theme="dark"] {
            --bg: #10141c;
            --panel: #171d28;
            --panel-border: #263044;
            --text: #e6edf6;
            --muted: #9aa4b2;
            --accent: #7aa5ff;
            --accent-strong: #9cb9ff;
            --row-hover: #212a3b;
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            --chip: #1f2840;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            padding: 28px 18px 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .site-header {
            background: linear-gradient(120deg, rgba(5, 150, 105, 0.08), rgba(5, 150, 105, 0.02));
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .site-header-text {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .site-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
        }

        .theme-toggle {
            border: 1px solid var(--panel-border);
            background-color: var(--panel);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
            background-color: var(--chip);
        }

        .content {
            padding: 22px 24px 30px;
        }

        .loading {
            text-align: center;
            padding: 28px;
            color: var(--muted);
        }

        .outline-list {
            list-style: none;
        }

        .outline-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--panel-border);
        }

        .outline-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 12px;
            transition: background-color 0.2s ease;
        }

        .outline-link:hover {
            background-color: var(--row-hover);
        }

        .outline-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .outline-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .outline-date {
            font-weight: 500;
            color: var(--accent-strong);
            background-color: var(--chip);
            padding: 3px 8px;
            border-radius: 999px;
        }

        .error {
            color: #b42318;
            padding: 20px;
            background-color: rgba(180, 35, 24, 0.08);
            border-left: 4px solid #b42318;
            border-radius: 8px;
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 12px 30px;
            }

            .content {
                padding: 18px 16px 24px;
            }

            .site-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="site-header-text">
                <div class="site-title">Hickman County, TN</div>
                <div class="subtitle">Meeting outlines and documents</div>
            </div>
            <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
                <span id="theme-toggle-text">Dark</span>
            </button>
        </header>

        <main class="content">
            <div id="content">
                <div class="loading">Loading outlines...</div>
            </div>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            themeToggle.setAttribute('aria-pressed', theme === 'dark');
            const toggleText = document.getElementById('theme-toggle-text');
            toggleText.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        function initTheme() {
            const stored = localStorage.getItem('theme');
            if (stored) {
                applyTheme(stored);
                return;
            }
            applyTheme(prefersDark.matches ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', () => {
            const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });

        prefersDark.addEventListener('change', (event) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(event.matches ? 'dark' : 'light');
            }
        });

        async function loadOutlines() {
            const contentDiv = document.getElementById('content');
            
            try {
                const response = await fetch('pages/outlines.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const outlines = await response.json();
                
                if (outlines.length === 0) {
                    contentDiv.innerHTML = '<p>No outlines available.</p>';
                    return;
                }

                // Sort by date (newest first)
                outlines.sort((a, b) => new Date(b.date) - new Date(a.date));

                const list = document.createElement('ul');
                list.className = 'outline-list';

                outlines.forEach(outline => {
                    const listItem = document.createElement('li');
                    listItem.className = 'outline-item';
                    
                    const link = document.createElement('a');
                    link.href = `viewer.html?file=${encodeURIComponent(outline.path)}`;
                    link.className = 'outline-link';
                    
                    const title = document.createElement('div');
                    title.className = 'outline-title';
                    title.textContent = outline.title || outline.folder.replace(/_/g, ' ');
                    
                    const meta = document.createElement('div');
                    meta.className = 'outline-meta';
                    
                    const date = document.createElement('span');
                    date.className = 'outline-date';
                    date.textContent = `Date: ${outline.date}`;
                    
                    const filename = document.createElement('span');
                    filename.textContent = outline.filename;
                    
                    meta.appendChild(date);
                    meta.appendChild(filename);
                    
                    link.appendChild(title);
                    link.appendChild(meta);
                    
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });

                contentDiv.innerHTML = '';
                contentDiv.appendChild(list);
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading outlines:</strong> ${error.message}
                    </div>
                `;
                console.error('Error loading outlines:', error);
            }
        }

        // Load outlines when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadOutlines();
        });
    </script>
</body>
</html>

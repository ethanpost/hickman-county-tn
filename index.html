<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hickman County, TN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-border: rgba(148, 163, 184, 0.35);
            --text: #0f172a;
            --muted: #475569;
            --accent: #1f2937;
            --accent-strong: #111827;
            --row-hover: rgba(31, 41, 55, 0.08);
            --shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
            --chip: rgba(226, 232, 240, 0.7);
            --header-sheen: rgba(31, 41, 55, 0.12);
        }

        body[data-theme="dark"] {
            --bg: #0f172a;
            --panel: #0b1220;
            --panel-border: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #9ca3af;
            --accent-strong: #d1d5db;
            --row-hover: rgba(156, 163, 175, 0.12);
            --shadow: 0 30px 70px rgba(2, 6, 23, 0.6);
            --chip: rgba(30, 41, 59, 0.7);
            --header-sheen: rgba(156, 163, 175, 0.12);
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.65;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(31, 41, 55, 0.08), transparent 50%), var(--bg);
            padding: 36px 18px 48px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            background-color: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .site-header {
            background: linear-gradient(120deg, var(--header-sheen), transparent 55%);
            padding: 24px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .site-header-text {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .site-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
        }

        .theme-toggle {
            border: 1px solid var(--panel-border);
            background-color: var(--panel);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
            background-color: var(--chip);
            box-shadow: 0 0 0 4px rgba(31, 41, 55, 0.12);
        }

        .refresh-button {
            border: 1px solid var(--panel-border);
            background-color: var(--panel);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            margin-left: 8px;
        }

        .refresh-button:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
            background-color: var(--chip);
            box-shadow: 0 0 0 4px rgba(31, 41, 55, 0.12);
        }

        .refresh-button:active {
            transform: scale(0.98);
        }

        .content {
            padding: 26px 28px 34px;
        }

        .loading {
            text-align: center;
            padding: 28px;
            color: var(--muted);
        }

        .outline-list {
            list-style: none;
        }

        .outline-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--panel-border);
        }

        .outline-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 14px;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
        }

        .outline-link:hover {
            background-color: var(--row-hover);
            border-color: rgba(31, 41, 55, 0.18);
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
        }

        .outline-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .outline-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .outline-date {
            font-weight: 600;
            color: var(--accent-strong);
            background-color: var(--chip);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .error {
            color: #b42318;
            padding: 20px;
            background-color: rgba(180, 35, 24, 0.08);
            border-left: 4px solid #b42318;
            border-radius: 8px;
        }

        @media (max-width: 640px) {
            body {
                padding: 22px 12px 32px;
            }

            .content {
                padding: 20px 18px 26px;
            }

            .site-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="site-header-text">
                <div class="site-title">Hickman County, TN</div>
                <div class="subtitle">Meeting outlines and documents</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button class="refresh-button" type="button" id="refresh-button" title="Refresh outlines">
                    ↻ Refresh
                </button>
                <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
                    <span id="theme-toggle-text">Dark</span>
                </button>
            </div>
        </header>

        <main class="content">
            <div id="content">
                <div class="loading">Loading outlines...</div>
            </div>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            themeToggle.setAttribute('aria-pressed', theme === 'dark');
            const toggleText = document.getElementById('theme-toggle-text');
            toggleText.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        function initTheme() {
            const stored = localStorage.getItem('theme');
            if (stored) {
                applyTheme(stored);
                return;
            }
            applyTheme(prefersDark.matches ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', () => {
            const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });

        prefersDark.addEventListener('change', (event) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(event.matches ? 'dark' : 'light');
            }
        });

        async function loadOutlines() {
            const contentDiv = document.getElementById('content');
            
            try {
                // Add cache-busting to ensure fresh content
                const cacheBuster = `?t=${Date.now()}`;
                const response = await fetch(`pages/outlines.json${cacheBuster}`, {
                    cache: 'no-store'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const outlines = await response.json();
                
                if (outlines.length === 0) {
                    contentDiv.innerHTML = '<p>No outlines available.</p>';
                    return;
                }

                // Sort by date (newest first)
                outlines.sort((a, b) => new Date(b.date) - new Date(a.date));

                const list = document.createElement('ul');
                list.className = 'outline-list';

                outlines.forEach(outline => {
                    const listItem = document.createElement('li');
                    listItem.className = 'outline-item';
                    
                    const link = document.createElement('a');
                    link.href = `viewer.html?file=${encodeURIComponent(outline.path)}`;
                    link.className = 'outline-link';
                    
                    const title = document.createElement('div');
                    title.className = 'outline-title';
                    title.textContent = outline.title || outline.folder.replace(/_/g, ' ');
                    
                    const meta = document.createElement('div');
                    meta.className = 'outline-meta';
                    
                    const date = document.createElement('span');
                    date.className = 'outline-date';
                    date.textContent = `Date: ${outline.date}`;
                    
                    const filename = document.createElement('span');
                    filename.textContent = outline.filename;
                    
                    meta.appendChild(date);
                    meta.appendChild(filename);
                    
                    link.appendChild(title);
                    link.appendChild(meta);
                    
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });

                contentDiv.innerHTML = '';
                contentDiv.appendChild(list);
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading outlines:</strong> ${error.message}
                    </div>
                `;
                console.error('Error loading outlines:', error);
            }
        }

        // Load outlines when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadOutlines();
            
            // Add refresh button functionality
            const refreshButton = document.getElementById('refresh-button');
            refreshButton.addEventListener('click', () => {
                loadOutlines();
            });
        });
    </script>
</body>
</html>

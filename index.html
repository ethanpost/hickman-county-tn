<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Hickman County, TN</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">Hickman County, TN</div>
      <h1 id="page-title">What's going on in Hickman County?</h1>
      <p>
        County meeting outlines, summaries, and notes by category, date, or title, and more.
      </p>
    </section>

    <section class="controls" aria-label="Filters and sorting">
      <div class="controls-grid">
        <div class="field">
          <label for="search">Search files</label>
          <input class="input" id="search" type="search" placeholder="Search title, folder, filename, or category">
        </div>

        <div class="field">
          <label for="category-filter">Category</label>
          <select class="select" id="category-filter">
            <option value="all">All categories</option>
          </select>
        </div>

        <div class="field">
          <label for="sort-by">Sort</label>
          <select class="select" id="sort-by">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
        </div>

        <div class="field">
          <div class="toggle-label">View</div>
          <div class="toggle-group" role="group" aria-label="View mode">
            <button class="toggle" id="view-list" type="button" aria-pressed="true">List</button>
            <button class="toggle" id="view-grouped" type="button" aria-pressed="false">Grouped</button>
          </div>
        </div>

        <div class="field">
          <span class="toggle-label">Actions</span>
          <button class="button" id="reset-controls" type="button">Reset</button>
        </div>
      </div>
    </section>

    <section aria-live="polite" aria-atomic="true">
      <div class="summary-bar">
        <div class="summary-text" id="results-summary" style="display:none">Loading files…</div>
        <div class="chip-row" id="active-filters"></div>
      </div>
      <div id="results-region">
        <div class="status-card">
          <h2>Loading archive</h2>
          <p>Please wait while the meeting files are loaded.</p>
        </div>
      </div>
      <p class="footer-note"></p>
    </section>
  </main>

  <script>
    const state = {
      items: [],
      query: '',
      category: 'all',
      sort: 'date-desc',
      view: 'list'
    };

    const elements = {
      search: document.getElementById('search'),
      categorySelect: document.getElementById('category-filter'),
      sort: document.getElementById('sort-by'),
      viewList: document.getElementById('view-list'),
      viewGrouped: document.getElementById('view-grouped'),
      reset: document.getElementById('reset-controls'),
      summary: document.getElementById('results-summary'),
      activeFilters: document.getElementById('active-filters'),
      resultsRegion: document.getElementById('results-region')
    };

    const formatter = new Intl.DateTimeFormat('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });

    const shortMonthFormatter = new Intl.DateTimeFormat('en-US', {
      month: 'short',
      day: 'numeric'
    });

    function titleizeCategory(value) {
      return value.replace(/[_-]+/g, ' ').replace(/\b\w/g, (character) => character.toUpperCase());
    }

    /** Basename only; `filename` in files.json should not include directories. */
    function fileBasename(name) {
      if (!name) {
        return '';
      }
      const normalized = String(name).replace(/\\/g, '/');
      const segments = normalized.split('/');
      return segments.pop() || '';
    }

    /** Trim slashes from folder so we join a clean relative path. */
    function normalizeFolder(folder) {
      return String(folder || '')
        .replace(/\\/g, '/')
        .replace(/^\/+/g, '')
        .replace(/\/+$/g, '');
    }

    /** Relative path to the .md from site root: `folder` segments + basename(`filename`) only. */
    function fileMarkdownRelPath(item) {
      const base = fileBasename(item.filename);
      if (!base) {
        return '';
      }
      const folder = normalizeFolder(item.folder);
      const segments = [...folder.split('/').filter(Boolean), base];
      return segments.join('/');
    }

    /**
     * Opens viewer.html with ?file=… so markdown is rendered as HTML.
     * Only uses `folder` + basename(`filename`); category is not part of the path.
     */
    function fileHref(item) {
      const rel = fileMarkdownRelPath(item);
      if (!rel) {
        return '';
      }
      return `viewer.html?file=${encodeURIComponent(rel)}`;
    }

    function getCategoryKey(item) {
      if (item.category) {
        return item.category;
      }
      const base = fileBasename(item.filename);
      const dated = base.match(/^\d{4}-\d{2}-\d{2}-(.+)\.md$/i);
      if (!dated) {
        return 'General';
      }
      let slug = dated[1];
      if (slug.endsWith('-outline')) {
        slug = slug.slice(0, -'-outline'.length);
      }
      return slug;
    }

    const FILE_BADGE_COLORS = new Set(['red', 'blue', 'yellow', 'green']);

    function normalizeBadges(item) {
      const raw = item.badges;
      if (!Array.isArray(raw)) {
        return [];
      }
      return raw
        .filter((entry) => entry && typeof entry.label === 'string' && entry.label.trim())
        .map((entry) => {
          const color = String(entry.color || 'blue').toLowerCase();
          return {
            label: entry.label.trim(),
            color: FILE_BADGE_COLORS.has(color) ? color : 'blue',
            message: typeof entry.message === 'string' ? entry.message : ''
          };
        });
    }

    function enrichItem(item) {
      const categoryKey = getCategoryKey(item);
      const categoryLabel = item.category || titleizeCategory(categoryKey);
      const badges = normalizeBadges(item);
      const badgeSearch = badges.flatMap((b) => [b.label, b.message].filter(Boolean));
      return {
        ...item,
        badges,
        categoryKey,
        categoryLabel,
        searchText: [item.title, item.filename, item.folder, item.category, categoryKey, ...badgeSearch]
          .filter(Boolean)
          .join(' ')
          .toLowerCase()
      };
    }

    function fileBadgeDomId(item, badgeIndex) {
      const path = fileMarkdownRelPath(item).replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-|-$/g, '') || 'file';
      return `fb-${path}-${badgeIndex}`.replace(/-+/g, '-');
    }

    function renderFileBadgesHtml(item) {
      const badges = item.badges;
      if (!badges.length) {
        return '';
      }
      return `
        <div class="result-file-badges">
          ${badges.map((badge, index) => {
            const tipId = fileBadgeDomId(item, index);
            const labelUpper = escapeHtml(badge.label).toUpperCase();
            return `
            <div class="file-badge-host">
              <button
                type="button"
                class="file-badge file-badge--${badge.color}"
                aria-expanded="false"
                aria-controls="${tipId}"
                aria-describedby="${tipId}"
              >
                <span class="file-badge__dot" aria-hidden="true"></span>
                <span class="file-badge__label">${labelUpper}</span>
              </button>
              <div class="file-badge-tooltip" id="${tipId}" role="tooltip">${escapeHtml(badge.message)}</div>
            </div>`;
          }).join('')}
        </div>`;
    }

    function formatDate(value) {
      return formatter.format(new Date(`${value}T00:00:00`));
    }

    function formatShortDate(value) {
      return shortMonthFormatter.format(new Date(`${value}T00:00:00`));
    }

    function populateCategoryOptions(items) {
      const categories = [...new Set(items.map((item) => item.categoryKey))].sort((left, right) =>
        left.localeCompare(right, undefined, { sensitivity: 'base' })
      );

      elements.categorySelect.innerHTML = '<option value="all">All categories</option>' + categories
        .map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`)
        .join('');
    }

    function getFilteredItems() {
      let filtered = [...state.items];

      if (state.query) {
        filtered = filtered.filter((item) => item.searchText.includes(state.query));
      }

      if (state.category !== 'all') {
        filtered = filtered.filter((item) => item.categoryKey === state.category);
      }

      filtered.sort((left, right) => {
        switch (state.sort) {
          case 'date-asc':
            return left.date.localeCompare(right.date);
          case 'title-asc':
            return left.title.localeCompare(right.title);
          case 'title-desc':
            return right.title.localeCompare(left.title);
          case 'date-desc':
          default:
            return right.date.localeCompare(left.date);
        }
      });

      return filtered;
    }

    function renderActiveFilters(filteredItems) {
      const chips = [];

      if (state.query) {
        chips.push(`<span class="chip">Search: “${escapeHtml(state.query)}”</span>`);
      }

      if (state.category !== 'all') {
        chips.push(`<span class="chip">Category: ${escapeHtml(state.category)}</span>`);
      }

      chips.push(`<span class="chip">View: ${state.view === 'list' ? 'List' : 'Grouped'}</span>`);
      chips.push(`<span class="chip">Showing ${filteredItems.length} of ${state.items.length}</span>`);

      elements.activeFilters.innerHTML = chips.join('');
    }

    function renderSummary(filteredItems) {
      if (!state.items.length) {
        elements.summary.textContent = 'No files available.';
        return;
      }

      const base = `Showing ${filteredItems.length} of ${state.items.length} files`;
      if (!filteredItems.length) {
        elements.summary.textContent = `${base}. Try clearing or changing your filters.`;
        return;
      }

      const qualifier = state.category !== 'all'
        ? ` in ${state.category}`
        : '';

      elements.summary.textContent = `${base}${qualifier}. Sorted ${describeSort(state.sort)}.`;
    }

    function describeSort(sort) {
      switch (sort) {
        case 'date-asc':
          return 'by oldest first';
        case 'title-asc':
          return 'alphabetically A–Z';
        case 'title-desc':
          return 'alphabetically Z–A';
        case 'date-desc':
        default:
          return 'by newest first';
      }
    }

    function renderList(items) {
      if (!items.length) {
        return `
          <div class="empty-state">
            <h2>No files match the current filters</h2>
            <p>Try a different search term, switch categories, or reset the controls to see the full archive.</p>
          </div>
        `;
      }

      return `
        <div class="results">
          ${items.map((item) => `
            <article class="result-item">
              <a class="group-link" href="${fileHref(item)}" aria-label="Open ${escapeHtml(item.title)}">
                <div class="result-date-wrap">
                  <div class="result-date">
                    ${formatShortDate(item.date)}
                    <span class="result-year">${item.date.slice(0, 4)}</span>
                  </div>
                </div>
                <div>
                  <h2 class="result-title">${escapeHtml(item.title)}</h2>
                  <div class="result-meta">
                    <span class="badge">${escapeHtml(item.categoryLabel)}</span>
                  </div>
                </div>
              </a>
              ${renderFileBadgesHtml(item)}
            </article>
          `).join('')}
        </div>
      `;
    }

    function renderGrouped(items) {
      if (!items.length) {
        return `
          <div class="empty-state">
            <h2>No groups to show</h2>
            <p>Adjust your search or filter settings to bring matching categories back into view.</p>
          </div>
        `;
      }

      const groups = items.reduce((accumulator, item) => {
        accumulator[item.categoryLabel] ??= [];
        accumulator[item.categoryLabel].push(item);
        return accumulator;
      }, {});

      const orderedGroups = Object.entries(groups).sort(([left], [right]) => left.localeCompare(right));

      return `
        <div class="grouped-results">
          ${orderedGroups.map(([groupName, groupItems]) => `
            <section class="group-card">
              <div class="group-header">
                <h2 class="group-title">${escapeHtml(groupName)}</h2>
                <div class="group-count">${groupItems.length} file${groupItems.length === 1 ? '' : 's'}</div>
              </div>
              <ul>
                ${groupItems.map((item) => `
                  <li>
                    <a class="group-link" href="${fileHref(item)}">
                      <div class="result-date">
                        ${formatShortDate(item.date)}
                        <span class="result-year">${item.date.slice(0, 4)}</span>
                      </div>
                      <div>
                        <strong>${escapeHtml(item.title)}</strong>
                      </div>
                    </a>
                    ${renderFileBadgesHtml(item)}
                  </li>
                `).join('')}
              </ul>
            </section>
          `).join('')}
        </div>
      `;
    }

    function renderResults() {
      const filteredItems = getFilteredItems();
      renderSummary(filteredItems);
      renderActiveFilters(filteredItems);
      elements.resultsRegion.innerHTML = state.view === 'list'
        ? renderList(filteredItems)
        : renderGrouped(filteredItems);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function closeAllFileBadges(root) {
      root.querySelectorAll('.file-badge-host.is-open').forEach((host) => {
        host.classList.remove('is-open');
        host.querySelector('button.file-badge')?.setAttribute('aria-expanded', 'false');
      });
    }

    function bindFileBadgeInteractions(root) {
      root.addEventListener('click', (event) => {
        const trigger = event.target.closest('.file-badge-host button.file-badge');
        if (!trigger || !root.contains(trigger)) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        const host = trigger.closest('.file-badge-host');
        const wasOpen = host.classList.contains('is-open');
        closeAllFileBadges(root);
        if (!wasOpen) {
          host.classList.add('is-open');
          trigger.setAttribute('aria-expanded', 'true');
        }
      });

      root.addEventListener(
        'focusout',
        (event) => {
          const host = event.target.closest?.('.file-badge-host');
          if (!host || !root.contains(host)) {
            return;
          }
          queueMicrotask(() => {
            if (!host.contains(document.activeElement)) {
              host.classList.remove('is-open');
              host.querySelector('button.file-badge')?.setAttribute('aria-expanded', 'false');
            }
          });
        },
        true
      );

      document.addEventListener('click', (event) => {
        if (event.target.closest('.file-badge-host')) {
          return;
        }
        closeAllFileBadges(root);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') {
          return;
        }
        closeAllFileBadges(root);
      });
    }

    function bindEvents() {
      bindFileBadgeInteractions(elements.resultsRegion);

      elements.search.addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        renderResults();
      });

      elements.categorySelect.addEventListener('change', (event) => {
        state.category = event.target.value;
        renderResults();
      });

      elements.sort.addEventListener('change', (event) => {
        state.sort = event.target.value;
        renderResults();
      });

      elements.viewList.addEventListener('click', () => {
        state.view = 'list';
        syncViewButtons();
        renderResults();
      });

      elements.viewGrouped.addEventListener('click', () => {
        state.view = 'grouped';
        syncViewButtons();
        renderResults();
      });

      elements.reset.addEventListener('click', () => {
        state.query = '';
        state.category = 'all';
        state.sort = 'date-desc';
        state.view = 'list';

        elements.search.value = '';
        elements.categorySelect.value = 'all';
        elements.sort.value = 'date-desc';

        syncViewButtons();
        renderResults();
      });
    }

    function syncViewButtons() {
      elements.viewList.setAttribute('aria-pressed', String(state.view === 'list'));
      elements.viewGrouped.setAttribute('aria-pressed', String(state.view === 'grouped'));
    }

    async function loadArchive() {
      try {
        const response = await fetch('files.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Request failed with ${response.status}`);
        }

        const data = await response.json();
        state.items = data.map(enrichItem);
        populateCategoryOptions(state.items);
        bindEvents();
        renderResults();
      } catch (error) {
        elements.summary.textContent = 'Unable to load files.';
        elements.resultsRegion.innerHTML = `
          <div class="status-card">
            <h2>Archive unavailable</h2>
            <p>The page could not load <code>files.json</code>. Please confirm the file exists and that you are serving this directory over HTTP.</p>
          </div>
        `;
      }
    }

    loadArchive();
  </script>
</body>
</html>

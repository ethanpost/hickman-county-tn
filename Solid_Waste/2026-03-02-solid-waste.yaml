notes: |-
* Did not meet last month due to ice storm.
* Approve minutes from Jan 5 meeting.
* 10 Year Plan (required by state).
  - Can I get a copy?
  - South Central APR/10 Year Plan
     - TDEC funded resource.
     - State determines if we meet our "recycling" goals.
     - Compliance/making efforts/convienance centers. (this is APR)
     - Grants will be coming to do the 10 year plan. Rolling out in the spring.
     - Most counties working off very old plans.
     - Cedar Ridge Land Fill is coming up for an approval for expansion.
     - No updates to current plan because grants are coming to hire consultant to update in the spring.
     - Likely won't be awarded until later this year or even later.
  - Revenue and Expenditures
     - Vote to approve report.
  - Tonnage Report
     - ~700 tons of debris from the storm, all will be burned.
     - Cost/cu yeard - $12/cu yard, can't be burn
        - Would bring in $450k
        - Not a good option only 70,000 cu yards available.
        - Piles seem to be hauled off. 
        - 50,000k cu yards is 31 acres 1 ft deep
        - hard to burn (is it?) is there a solution here?
  - Escalation letters have not been sent out yet.
      - 750k in old unpaid bills.
  - Jason Barge
      - Help get land fill permit next fiscal year.
      - 5-6ac expansion, 18 month process with the state.
      - Jackson Law - not exempt from jackson law.
      - Should not need monitoring well (expensive) up front but maybe down the road in phase 2.
      - Should allow for 300-400k cu yards of space.
      - Might have to reroute drainage.
      - Grading.
      - Area has been determine to be a ditch last year and we have a 5 year window for that.
   - Resolution on exempt properties
      - Something about resolved by oct or $30 fee?? unclear

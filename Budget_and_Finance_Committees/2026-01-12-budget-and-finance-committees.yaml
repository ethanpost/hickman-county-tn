video_title: "1/12/2025 Budget and Finance Committees Audio - Hickman County, TN"
description: "Audio recording of the Budget and Finance Committees meeting on 1/12/2025 in Hickman County, TN."
uploaded: true
notes: |-

  ## Beer Board

  * Location with 300ft - opposes permit - within 775 ft building church camp - motion to table to next month - has to do with beer license - **WHAT IS THE ADDRESS?** - notice has been put in the paper twice - people have to be present to object - motion ameneded to postpone until next month - most yes - will be heard next month

  ## Budget Finance Human Resources

  * Approval of agenda
  * Public Comment
  * Budget Ammendments
    - 2640 - Clean up ammendments - all yes
    - 2641 - Sheriffs department to use additional revenue from impounded vehicles, 30+k
    - 2642 - 2 tvs for open meetings system for this courtroom - coming form direct appropriation grant
    - 2643 - Extra money to finish up special election and May primary.
    - 2644 - From drug fund to use money for vet serviece and drug dog.
    - 2645 - Reclassify funds for hwy board - 2 long term employees retired and something else
  * HR Business
    - Dept heads met, came up with more unified policy.
    - Main changes to page 5 dealing with leave accrual for employees who leave and come back.
    - Approved to go to county commissiion
  * Unfinished business
    - None
  * New business
    - Steve Gian - Discuss grant to cville for 4mil+ $ requested Greer projects/spent/completion dates, and balance.
      - Spend 1.8 million  
      - Have to be spent my the end of this year.
      - What grant is this? 
      - Engineering work to get water is district 7.
      - Try to get an update by august of this year.
    - Mr Jenkins - Countycan do indexing (Randy)
      - Shorten re-appraisal cycle to 4 years.
      - Try to get it down to 2 year.
      - Do indexing in year 2 of a 4 year plan.
      - "Ratio" cost us almost 800k $.
      - Everything that sells in a "neighborhood" or a section (300 neighborhoods now).
      - In year 2 we need a certified tax rate.
      - "Help stablize the tax base."
      - Ratio took 800k away from us.
      - No way to recoup this unless we do this.
      - ** CAN WE GET A COPY OF THE REAPPRAISEL PLAN?**
      - More companies moving in to county, can call for a ratio in year 1 or 3, this plan takes care of that.
      - Everything in the neighborhood goes up if one house in the neighborhood sells.
      - Index happens in year 2 unless a ratio is called for.
      - Wants to take it to county commission this month.
      - Sent to county commission.
      -- ***MY RECOMENDATION IS TO CAREFULLY DOCUMENT SALES AT TIME OF SALE IN YOUR NEIGHBORHOOD***
      -- ***WE NEED TO GET A MAP OF NEIGHBORHOODS***
      -- ***IS THIS BASED ON $ or % OF VALUE?***
      -- ***HOW DO THEY DETERMINE WHAT VALUE IS TIED TO RESIDENCE AND WHAT IS TIED TO PROPERTY?***
    - Financing of cardiac monitors and CPR devices for EMS
      - Have not approached the health foundation.
      - leasing option needs to go to the state? (comptrollers office)
      - ***BUY WHAT WE CAN AFFORD NOW, WAIT FOR MORE FUNDING IN THE FUTURE, BUDGET FOR ONE IN THE FUTURE***
      - ***FOR NOW I SUGGEST LEASING 5 and assume you can buy 2*** Barnhill actually brough this up.
      - ***THERE IS MORE MONEY COMING INTO THE OPIOID FUND IN THE FUTURE***
      - Motion to lease 6 year lease for all for now with the likelihood things will change but at least go before the state comptrollers office.
    - Opioid Board program
      - 460K was dispersed to 10 organizations this year.
      - Navigator contracted or part time position?
      - Mayor speaks on the issue.
      - Navigator would oversee funds but have no power to distribute. 
        - List of functions was given (central point of contact).
        - Preparing required reports.
        - ***WE CAN HOLD THE MONEY***
        - ***CAN ONLY A CERTAIN % BE USED FOR A MONITOR***
        - ***WHERE ARE THE %'s defined?***
        - ***UNITED WAY IS VERY ACTIVE HERE? Debbie Riany, Katie Harrington.***
        - Navigator can't issue money, still needs to go before the board.
        - ***MY IDEA TO REVAMP A BUILDING AND HIRE PEOPLE WHO MAY BE IN RECOVERY***
    - Budget Schedule
        - Approved 

video_title: "1/6/2025 Opioid Settlement Board Audio - Hickman County, TN"
description: "Audio recording of the Opioid Settlement Board meeting on 1/6/2025 in Hickman County, TN."
uploaded: true
notes: |-
  Public comment was received, followed by a financial report. Under old business, the Mayor appointed a new board member (Guido/Kenneth Daron, ken.daron@yahoo.com). The vote for vice chair was tabled to the next meeting. The Mayor reviewed the navigator program, emphasizing a desire to follow the board’s wishes; the Mayor serves as a non-voting member. There was discussion about whether matters regarding the navigator were exploratory only at the commissioner meeting.
  
  The schedule for 2025 grant applications was discussed: the timeline is affected by current vacancies, with applications due in February. Only two grants are under consideration this year (United Way and the school), as Casa removed their request. The grant decision was tabled to next month.
  
  Other board work for 2025 was discussed, including reappointments in February and a reminder that last quarterly reports are due between the end of March and mid-April. The next meeting was scheduled for February 10th.
  
  Under new business, the Bernard Community Center (BCC) proposal and in-kind reimbursement were discussed. Emails from Amy Springer and Karen Cox (seen by the county attorney) were referenced. The workplan is contingent on certain findings, and there may be an appeal, but executive session was deemed unnecessary as there is no litigation at this time. The BCC has signed a contract; a request was made for a copy of that contract.
  
  An issue regarding ADA bathrooms was raised: although included in the initial request, this was excluded from the contract’s approved list (Exhibit A). There was a suggestion that in the future, applications should not be approved if any part is omitted from the final contract. Some uncertainty remains whether the ADA improvements were actually included in the application. Questions were raised about the mechanics of processing smaller payments or disbursements if everything must go to the UT SMART Initiative, and about the amount given by the Health Foundation to Bernard Community Center (with $50,000 mentioned). An article in the local paper was referenced regarding these matters.
  
  The in-kind discussion included that the Bernard Community Center’s obligations should be completed within 18 months, or at most three years. The facility is often rented out on Saturdays. There was also mention of the INDEPTH Nicotine program for youth, held every other month on the second Saturday.


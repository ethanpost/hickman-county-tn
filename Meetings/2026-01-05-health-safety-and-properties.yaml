video_title: ""
description: "Audio recording of the Health Safety and Properties Committee meeting on 1/5/2025 in Hickman CountZy, TN."
uploaded: true
notes: |-
  Call to order.
  10 present - 4 absent. Agenda was emailed out. (Nash arrives so 11 present.)

  EMA Monthly Report:
    - Report was in the packet; no questions.
    - Still working on contracts with the state to improve communications, likely by sharing towers.
    - Anticipated implementation in January.

  Allen - EMS:
    - Quote for cardiac monitors discussed.
    - November: 232 calls, $67k collections, $165k charges.
    - December: 280 calls; collections and charges not available.
    - Two write-off requests approved.
    - Quote of $555k for cardiac monitors (3-year lease or 6-year loan), prices locked in until March 1.
    - 7 monitors and one CPR device per vehicle.
    - $30k available from grant.
    - Potential to use opioid board funds.
    - Motion and approval to send to the budget committee for further discussion (meeting next Monday).
    - Noted need for potential educational opportunity for the budget and safety committees regarding equipment costs.
    - Discussion whether purchases should be triggered by equipment failure.
    - Suggestion to refresh a couple of monitors each year rather than replacing all at once.
    - Questions about maximum billable rate per run (Medicare).

  Matt - Maintenance.

  Sheriff Craft:
    - 1,328 calls in December.
    - 138 in the jail.
    - Office established for Judge Lane and assistant.
    - Brady Turner deployed to Memphis with National Guard.
    - Patrol and jail fully staffed.
    - STR donated a 2017 Kenworth for federal surplus equipment.
    - Possible resolution anticipated for a nicotine pouch program (revenue line item for jail and justice center upgrades).
    - Detective Martinez completed 3 months of K9 training in Virginia, funded via College fund.
    - Deputy Turner awarded a scholarship to the same K9 school; moving up to 4 dogs.
    - Free dog food for the dogs.
    - Medical process overhaul reportedly yielding big savings.
    - Question: What specific upgrades are planned for the jail and justice center?

  Old Business.

  Pinewood Station:
    - Small amount of painting completed.
    - Resin applied to floors.
    - Cabinets, lights, fixtures, and trim still need installation.
    - No timeline given.
    - Fire Marshal asked if there were any known issues.
    - Collection at the 4-way intersection is being sent to a lawyer.

  New Business:
    - Surplus property; finance department sent an email. Voted on and approved.
    - (Note: What was referenced here? It was approved.)

  Other New Business:
    - A road was added in District 1 to the cemetery.
    - Property appears to be under litigation.
    - Vote to add was done; now will be undone and reconsidered at the County Commissioner meeting on the 4th Monday.

  Nash - Land Use Plan:
    - Extensive discussion about the proposal to use committee time to work toward a version of the Land Use Plan acceptable to all.
    - Question: Where is the current Land Use Guide available?
    - Noted that discussion on tax expectations was interesting (expectation that taxes would be lower).
    - Per capita debt was $1,500, now $500 (approx. $15 million?).
    - Motion to table until February. Roll call: 5 no, 6 yes.
    - Roll call vote on "Nash plan": did not pass.

video_title: "2/9/2026 Budget and Finance Committees Audio - Hickman County, TN"
description: "Audio recording of the Budget and Finance Committees meeting on 2/9/2026 in Hickman County, TN."
notes: |-
  ## Finance Committee
  * Motion to approve agenda.
  * Approve minutes from previous meeting.
  * At 56% of property tax revenue. Was as 60% last year at this time?
  * Motion to approve financial summary for Jan.
  * Old business.
  * Motion to adjourn.

  ## Beer Board - Budget Finance and HR Committee

  * Public comment - Lewis
    - Ashley Lewis - General Forest Circle - Object - 279 ft from location
    - Solomon Hannah - Owner - didn't say much, not sure they spoke english well.
    - McCoy - Building is front yard.
    - Is this Bee's Closet? 
    - Beer permit is denied.
    - Motion to adjourn.
    
  * No public comment.
  * Standard motions.
  * Reclassify some funds for Sheriff's department.
  * Other not so interesting stuff.
  * New Business
    - Below is for emergency work related to the ice storm but also pertains to heart monitors.
    - Update on capital outlay - we can't borrow capital outlay notes
    - We can do for heart monitor.
    - Tax revenue anticipation note through a bank for up to 3 years.
    - Running at about 300k to 350k already.
    - Motion to allow anticipation notes for up 1.2 million.
    - Some small "objection" regarding Opiod funding from Devin Pickard.
    - Discussion of costs with recovery from EMA Pete
    - Nash talks about 27 page ruling by Judge Darnell
      - Water authority appeal has been denied.
      - Think this is related to Lick creek.
      - 2.4 million in 2005 to build sewer line all funded by Hickman County, runs from school up to Sonic.
      - Water Authority has been denied access to that line to Hickman County residents but Dickson residents are allowed.
      - Question, what are we going to do about this?
      - WADC - Water Authority of Dickson County 
      - Go on the offensive?

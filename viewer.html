<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hickman County, TN - Document Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: #000;
            background-color: #f6f6ef;
            padding: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: #f6f6ef;
            border: 1px solid #e6e6df;
        }

        .header {
            background-color: #ff6600;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            color: #000;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-link::before {
            content: "← ";
        }

        h1 {
            color: #000;
            font-size: 16px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #828282;
        }

        .error {
            color: #e74c3c;
            padding: 20px;
            background-color: #fee;
            border-left: 4px solid #e74c3c;
            border-radius: 4px;
        }

        #content {
            line-height: 1.6;
            padding: 18px 12px 28px;
        }

        /* Markdown styling */
        #content h1 {
            color: #000;
            margin-top: 24px;
            margin-bottom: 16px;
            font-size: 18px;
            border-bottom: 1px solid #e6e6df;
            padding-bottom: 6px;
        }

        #content h2 {
            color: #000;
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        #content h3 {
            color: #000;
            margin-top: 18px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #content h4, #content h5, #content h6 {
            color: #000;
            margin-top: 14px;
            margin-bottom: 8px;
        }

        #content p {
            margin-bottom: 15px;
        }

        #content ul, #content ol {
            margin-bottom: 15px;
            padding-left: 24px;
        }

        #content li {
            margin-bottom: 8px;
        }

        #content blockquote {
            border-left: 3px solid #ff6600;
            padding-left: 16px;
            margin: 18px 0;
            color: #555;
        }

        #content blockquote p {
            margin-bottom: 10px;
        }

        #content a {
            color: #000;
            text-decoration: none;
        }

        #content a:hover {
            text-decoration: underline;
        }

        #content code {
            background-color: #f0f0e9;
            padding: 2px 4px;
            font-family: "Courier New", monospace;
            font-size: 12px;
        }

        #content pre {
            background-color: #f0f0e9;
            padding: 12px;
            overflow-x: auto;
            margin-bottom: 15px;
        }

        #content pre code {
            background-color: transparent;
            padding: 0;
        }

        #content strong {
            color: #000;
            font-weight: bold;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 12px;
        }

        #content table th,
        #content table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        #content table th {
            background-color: #f0f0e9;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">Back to Index</a>
            <h1>Hickman County, TN</h1>
        </div>
        
        <div id="content">
            <div class="loading">Loading document...</div>
        </div>
    </div>

    <script>
        async function loadMarkdown() {
            const contentDiv = document.getElementById('content');
            
            // Get file path from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            
            if (!file) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> No file specified. Please provide a file parameter in the URL.
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch(file);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdown = await response.text();
                
                // Render markdown to HTML using marked.js
                const html = marked.parse(markdown);
                contentDiv.innerHTML = html;
                
                // Update page title if we can extract it from the markdown
                const firstLine = markdown.split('\n')[0];
                if (firstLine.startsWith('# ')) {
                    document.title = firstLine.substring(2) + ' - Hickman County, TN';
                }
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading document:</strong> ${error.message}
                    </div>
                `;
                console.error('Error loading markdown:', error);
            }
        }

        // Load markdown when page loads
        document.addEventListener('DOMContentLoaded', loadMarkdown);
    </script>
</body>
</html>

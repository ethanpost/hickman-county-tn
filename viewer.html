<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Hickman County, TN - Document Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-border: rgba(148, 163, 184, 0.35);
            --text: #0f172a;
            --muted: #475569;
            --accent: #1f2937;
            --accent-strong: #111827;
            --row-hover: rgba(31, 41, 55, 0.08);
            --shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
            --chip: rgba(226, 232, 240, 0.7);
            --code: rgba(226, 232, 240, 0.6);
            --header-sheen: rgba(31, 41, 55, 0.12);
        }

        body[data-theme="dark"] {
            --bg: #0f172a;
            --panel: #0b1220;
            --panel-border: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #9ca3af;
            --accent-strong: #d1d5db;
            --row-hover: rgba(156, 163, 175, 0.12);
            --shadow: 0 30px 70px rgba(2, 6, 23, 0.6);
            --chip: rgba(30, 41, 59, 0.7);
            --code: rgba(30, 41, 59, 0.75);
            --header-sheen: rgba(156, 163, 175, 0.12);
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(31, 41, 55, 0.08), transparent 50%), var(--bg);
            padding: 36px 18px 48px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            background-color: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(120deg, var(--header-sheen), transparent 55%);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-link {
            color: var(--text);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background-color: var(--panel);
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .back-link:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
            background-color: var(--chip);
            box-shadow: 0 0 0 4px rgba(31, 41, 55, 0.12);
        }

        .back-link::before {
            content: "←";
        }

        h1 {
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .theme-toggle {
            border: 1px solid var(--panel-border);
            background-color: var(--panel);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
            background-color: var(--chip);
            box-shadow: 0 0 0 4px rgba(31, 41, 55, 0.12);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .error {
            color: #b42318;
            padding: 20px;
            background-color: rgba(180, 35, 24, 0.08);
            border-left: 4px solid #b42318;
            border-radius: 8px;
        }

        #content {
            line-height: 1.75;
            padding: 28px 28px 36px;
        }

        /* Markdown styling */
        #content h1 {
            color: var(--text);
            margin-top: 28px;
            margin-bottom: 18px;
            font-size: 22px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        #content h2 {
            color: var(--text);
            margin-top: 24px;
            margin-bottom: 14px;
            font-size: 19px;
        }

        #content h3 {
            color: var(--text);
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        #content h4, #content h5, #content h6 {
            color: var(--text);
            margin-top: 18px;
            margin-bottom: 10px;
        }

        #content p {
            margin-bottom: 15px;
        }

        #content ul, #content ol {
            margin-bottom: 15px;
            padding-left: 24px;
        }

        #content li {
            margin-bottom: 8px;
        }

        #content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 16px;
            margin: 18px 0;
            color: var(--muted);
            background-color: var(--chip);
            border-radius: 12px;
            padding: 14px 18px;
        }

        #content blockquote p {
            margin-bottom: 10px;
        }

        #content a {
            color: var(--accent-strong);
            text-decoration: none;
        }

        #content a:hover {
            text-decoration: underline;
        }

        #content code {
            background-color: var(--code);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: "JetBrains Mono", "Courier New", monospace;
            font-size: 12px;
        }

        #content pre {
            background-color: var(--code);
            padding: 16px;
            border-radius: 14px;
            overflow-x: auto;
            margin-bottom: 15px;
            border: 1px solid var(--panel-border);
        }

        #content pre code {
            background-color: transparent;
            padding: 0;
        }

        #content strong {
            color: var(--text);
            font-weight: 600;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 12px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        #content table th,
        #content table td {
            border: 1px solid var(--panel-border);
            padding: 10px;
            text-align: left;
        }

        #content table th {
            background-color: var(--chip);
            font-weight: 600;
        }

        @media (max-width: 640px) {
            body {
                padding: 22px 12px 32px;
            }

            #content {
                padding: 22px 18px 28px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-left {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-link">Back to index</a>
                <h1>Hickman County, TN</h1>
            </div>
            <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
                <span id="theme-toggle-text">Dark</span>
            </button>
        </div>
        
        <div id="content">
            <div class="loading">Loading document...</div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            themeToggle.setAttribute('aria-pressed', theme === 'dark');
            const toggleText = document.getElementById('theme-toggle-text');
            toggleText.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        function initTheme() {
            const stored = localStorage.getItem('theme');
            if (stored) {
                applyTheme(stored);
                return;
            }
            applyTheme(prefersDark.matches ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', () => {
            const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });

        prefersDark.addEventListener('change', (event) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(event.matches ? 'dark' : 'light');
            }
        });

        async function loadMarkdown() {
            const contentDiv = document.getElementById('content');
            
            // Get file path from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            
            if (!file) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> No file specified. Please provide a file parameter in the URL.
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch(file, { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdown = await response.text();
                
                // Render markdown to HTML using marked.js
                const html = marked.parse(markdown);
                contentDiv.innerHTML = html;
                
                // Update page title if we can extract it from the markdown
                const firstLine = markdown.split('\n')[0];
                if (firstLine.startsWith('# ')) {
                    document.title = firstLine.substring(2) + ' - Hickman County, TN';
                }
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading document:</strong> ${error.message}
                    </div>
                `;
                console.error('Error loading markdown:', error);
            }
        }

        // Load markdown when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadMarkdown();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Hickman County, TN - Document Viewer</title>
    <link rel="stylesheet" href="site.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <main class="page viewer-page">
        <article class="viewer-card">
            <header class="viewer-header">
                <a href="index.html" class="back-link">Back to index</a>
                <h1 class="viewer-title">Hickman County, TN</h1>
            </header>
            <div id="content">
                <div class="loading">Loading document...</div>
            </div>
        </article>
    </main>

    <script>
        async function loadMarkdown() {
            const contentDiv = document.getElementById('content');
            
            // Get file path from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            
            if (!file) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> No file specified. Please provide a file parameter in the URL.
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch(file, { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdown = await response.text();
                
                // Render markdown to HTML using marked.js
                const html = marked.parse(markdown);
                contentDiv.innerHTML = html;
                
                // Update page title if we can extract it from the markdown
                const firstLine = markdown.split('\n')[0];
                if (firstLine.startsWith('# ')) {
                    document.title = firstLine.substring(2) + ' - Hickman County, TN';
                }
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading document:</strong> ${error.message}
                    </div>
                `;
                console.error('Error loading markdown:', error);
            }
        }

        // Load markdown when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadMarkdown();
        });
    </script>
</body>
</html>
